# AMS nginx stream map (ssl_preread on :443).
# Empty SNI / ECH / unknown host → real HTTPS. Reality dests stay on xray.
map $ssl_preread_server_name $ams_backend {
    ams.wingsvpn.shop      127.0.0.1:8080;
    wingsvpn.shop          127.0.0.1:8080;
    www.wingsvpn.shop      127.0.0.1:8080;
    vpn.wingsvpn.shop      127.0.0.1:8080;
    deepl.com              127.0.0.1:10443;
    www.deepl.com          127.0.0.1:10443;
    www.apple.com          127.0.0.1:10443;
    apple.com              127.0.0.1:10443;
    ""                     127.0.0.1:8080;
    -                      127.0.0.1:8080;
    default                127.0.0.1:8080;
}
