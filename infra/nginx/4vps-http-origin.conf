# 4VPS HTTP origin for Cloudflare / AMS nginx.
# Port 443 stays Xray Reality — do not bind HTTPS here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name wingsvpn.shop www.wingsvpn.shop vpn.wingsvpn.shop ams.wingsvpn.shop _;

    root /opt/nordwings/web;
    index index.html;

    location = /miniapp { return 301 /miniapp/; }

    location /miniapp/sub/ {
        proxy_pass http://127.0.0.1:8001/sub/;
        proxy_http_version 1.1;
        proxy_set_header Host wingsvpn.shop;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_pass_header profile-title;
        proxy_pass_header subscription-userinfo;
        proxy_pass_header profile-update-interval;
        proxy_pass_header content-disposition;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /miniapp/ {
        alias /opt/nordwings/web/miniapp/;
        index index.html;
        try_files $uri $uri/ /miniapp/index.html;
        add_header Cache-Control "no-store" always;
    }

    location /sub/ {
        proxy_pass http://127.0.0.1:8081/sub/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header profile-title;
        proxy_pass_header subscription-userinfo;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
    }

    # CryptoBot / Platega hit the payment API on :8001 (not static /).
    location = /crypto-webhook {
        proxy_pass http://127.0.0.1:8001/crypto-webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /platega-webhook {
        proxy_pass http://127.0.0.1:8081/platega-webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/issue-key {
        proxy_pass http://127.0.0.1:8081/api/issue-key;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/trial {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/referrals {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/web/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /setup/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host wingsvpn.shop;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
