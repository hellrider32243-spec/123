# Temporary public HTTPS while Cloudflare origin still points at the dead AMS box.
# TCP 443 is Xray Reality. Telegram webhooks only accept 80/88/443/8443 — use 88.
server {
    listen 88 ssl http2;
    listen [::]:88 ssl http2;
    listen 2087 ssl http2;
    listen [::]:2087 ssl http2;
    server_name wingsvpn.139.28.240.160.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/wingsvpn.139.28.240.160.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wingsvpn.139.28.240.160.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/nordwings/web;
    index index.html;

    location = /telegram-webhook {
        proxy_pass http://127.0.0.1:8081/telegram-webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /payments-bot-webhook {
        proxy_pass http://127.0.0.1:8082/payments-bot-webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /miniapp { return 301 /miniapp/; }

    location /miniapp/sub/ {
        proxy_pass http://127.0.0.1:8001/sub/;
        proxy_http_version 1.1;
        proxy_set_header Host wingsvpn.shop;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header User-Agent $http_user_agent;
        proxy_pass_header profile-title;
        proxy_pass_header subscription-userinfo;
        proxy_pass_header profile-update-interval;
        proxy_pass_header content-disposition;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /miniapp/ {
        alias /opt/nordwings/web/miniapp/;
        index index.html;
        try_files $uri $uri/ /miniapp/index.html;
        add_header Cache-Control "no-store" always;
    }

    location /sub/ {
        proxy_pass http://127.0.0.1:8081/sub/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_header profile-title;
        proxy_pass_header subscription-userinfo;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
    }

    location = /crypto-webhook {
        proxy_pass http://127.0.0.1:8001/crypto-webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /platega-webhook {
        proxy_pass http://127.0.0.1:8081/platega-webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /setup/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host wingsvpn.shop;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
