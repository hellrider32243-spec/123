# Amsterdam relay: SNI split on :443 + HTTPS subscription proxy.
# - SNI ams.wingsvpn.shop → local nginx (subscription)
# - everything else (incl. Reality SNI www.apple.com) → Xray on 127.0.0.1:10443

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 8192;
}

stream {
    map $ssl_preread_server_name $ams_backend {
        ams.wingsvpn.shop  127.0.0.1:8443;
        default            127.0.0.1:10443;
    }

    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;
        proxy_pass $ams_backend;
        ssl_preread on;
        proxy_timeout 600s;
        proxy_connect_timeout 5s;
    }
}

http {
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Local HTTPS terminator for subscription (stream routes SNI here).
    server {
        listen 127.0.0.1:8443 ssl;
        server_name ams.wingsvpn.shop;

        ssl_certificate     /etc/letsencrypt/live/ams.wingsvpn.shop/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ams.wingsvpn.shop/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /miniapp/sub {
            return 301 /miniapp/sub/;
        }

        location /miniapp/sub/ {
            proxy_pass http://172.86.68.87:8001/sub/;
            proxy_set_header Host wingsvpn.shop;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header User-Agent $http_user_agent;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            # Happ needs the JSON body + custom headers through.
            proxy_pass_header profile-title;
            proxy_pass_header subscription-userinfo;
            proxy_pass_header profile-update-interval;
            proxy_pass_header content-disposition;
            proxy_buffering off;
        }

        location / {
            return 204;
        }
    }
}
